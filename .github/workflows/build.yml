name: build

# Autobuild: every push to main, every pull request and every v* tag produces the shippable
# Windows artifacts (single-file exe -> NSIS setup exe -> portable ZIP) on a Windows runner, so
# the build published here is the same one a Windows machine produces. Tags additionally publish
# a GitHub release with both files attached.
#
# build-wine.sh is only for machines without a Windows SDK; CI uses plain dotnet publish.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used by the release step on a tag push

jobs:
  windows-x64:
    name: Build win-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: dotnet publish (Release, win-x64, self-contained, single file)
        shell: pwsh
        run: |
          dotnet publish YTLiveStats.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none `
            -o dist/publish
          if (-not (Test-Path dist/publish/YTLiveStats.exe)) { throw 'YTLiveStats.exe was not produced' }
          "{0:N1} MB" -f ((Get-Item dist/publish/YTLiveStats.exe).Length / 1MB)

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build installer (makensis)
        shell: pwsh
        run: |
          $makensis = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw 'makensis.exe not found after installing NSIS' }
          & $makensis installer/YTLiveStats.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path dist/YTLiveStats-1.0.1-setup.exe)) { throw 'setup exe was not produced' }

      - name: Build portable ZIP
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/make-portable.ps1
          if (-not (Test-Path dist/YTLiveStats-1.0.1-portable.zip)) { throw 'portable zip was not produced' }

      - name: Verify artifacts
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Select-Object Name, Length | Format-Table -AutoSize
          foreach ($f in 'dist/YTLiveStats-1.0.1-setup.exe', 'dist/YTLiveStats-1.0.1-portable.zip') {
            if ((Get-Item $f).Length -lt 1000000) { throw "$f is suspiciously small" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: YTLiveStats-win-x64
          path: |
            dist/publish/YTLiveStats.exe
            dist/YTLiveStats-1.0.1-setup.exe
            dist/YTLiveStats-1.0.1-portable.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YTLiveStats-1.0.1-setup.exe
            dist/YTLiveStats-1.0.1-portable.zip
          fail_on_unmatched_files: true
