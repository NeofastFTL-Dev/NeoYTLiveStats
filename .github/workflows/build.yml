name: build

# The app is Rust + egui/eframe now, so CI compiles it on both targets the port has to run on
# and runs the headless self-test that covers the parsers, the formatter and the settings,
# instead of assuming they still behave the same way.
on:
  push:
    branches: [main, linux, macos]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install egui/winit system libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxi-dev libxcursor-dev \
            libxrandr-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --release --locked

      - name: Headless self-test
        run: ./target/release/ytlivestats --selftest

      - name: Check the binary
        run: |
          set -euo pipefail
          ftype=$(file -b target/release/ytlivestats)
          echo "$ftype"
          case "$ftype" in
            *ELF*) ;;
            *) echo "not a Linux ELF binary"; exit 1 ;;
          esac
          size=$(stat -c %s target/release/ytlivestats)
          test "$size" -gt 1000000 || { echo "binary is only $size bytes"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ytlivestats-linux-x86_64
          path: target/release/ytlivestats
          if-no-files-found: error

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Self-test
        run: target/release/ytlivestats.exe --selftest

      - name: Check the exe
        shell: pwsh
        run: |
          $exe = "target/release/ytlivestats.exe"
          if (-not (Test-Path $exe)) { throw "ytlivestats.exe was not produced" }
          $size = (Get-Item $exe).Length
          Write-Host "size: $size bytes"
          if ($size -lt 1000000) { throw "the exe is only $size bytes" }

      - uses: actions/upload-artifact@v4
        with:
          name: ytlivestats-windows
          path: target/release/ytlivestats.exe
          if-no-files-found: error

  macos:
    name: macOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: ./target/release/ytlivestats --selftest

      - name: Check the binary
        run: |
          set -euo pipefail
          ftype=$(file -b target/release/ytlivestats)
          echo "$ftype"
          case "$ftype" in
            *Mach-O*) ;;
            *) echo "not a Mach-O binary"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ytlivestats-macos
          path: target/release/ytlivestats
          if-no-files-found: error

  release:
    name: Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ytlivestats-linux-x86_64
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: ytlivestats-windows
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: ytlivestats-macos
          path: dist/macos

      - name: Name the binaries after the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -s dist/linux/ytlivestats
          test -s dist/windows/ytlivestats.exe
          test -s dist/macos/ytlivestats
          mkdir -p out
          cp dist/linux/ytlivestats "out/YTLiveStats-${version}-linux-x86_64"
          cp dist/windows/ytlivestats.exe "out/YTLiveStats-${version}-windows-x86_64.exe"
          cp dist/macos/ytlivestats "out/YTLiveStats-${version}-macos"
          chmod 755 out/YTLiveStats-*
          ls -l out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: YTLiveStats ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Fullscreen overlay with live YouTube subscriber, channel-view and video-view counters.

            Linux x86_64, Windows x86_64 and macOS binaries for this tag, each built and
            self-tested by CI on its own platform.
