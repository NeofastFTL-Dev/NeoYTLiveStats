[package]
name = "ytlivestats"
version = "1.1.0"
edition = "2021"
description = "Fullscreen overlay with live YouTube subscriber, channel-view and video-view counters"
license = "MIT"
authors = ["NeofastFTL"]

[[bin]]
name = "ytlivestats"
path = "src/main.rs"

[build-dependencies]
embed-resource = "2.5"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
